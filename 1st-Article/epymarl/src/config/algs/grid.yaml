# GRID algorithm config for WSN routing.
#
# GRID (Graph-Routed Individual-credit Decomposition) augments QMIX's
# hypernetwork with topology features (degree centrality, BS distance)
# computed from the WSN communication graph.  This gives the mixer
# topology awareness while preserving QMIX's proven gradient dynamics.
#
# Key differences from QMIX:
#   - mixer: "grid" augments state with per-agent topology features
#   - coverage_radius: 35.0 (WSN communication range for adjacency)
#   - Same hypernetwork architecture, ~9% more params from wider input

# --- Action selection ---
action_selector: "epsilon_greedy"
epsilon_start: 0.5
epsilon_finish: 0.01
epsilon_anneal_time: 150000
evaluation_epsilon: 0.01

# --- Parallelism ---
runner: "parallel"
batch_size_run: 4

# --- Replay buffer ---
buffer_size: 15000

# --- Target network ---
target_update_interval_or_tau: 30

# --- Observation features ---
obs_agent_id: True
obs_last_action: True
obs_individual_obs: True

# --- Learner ---
standardise_returns: True
standardise_rewards: False
agent_output_type: "q"
learner: "q_learner"
double_q: True
mixer: "grid"
use_rnn: True
mixing_embed_dim: 64
hypernet_layers: 2
hypernet_embed: 64
coverage_radius: 35.0

name: "grid"
